name: Weekly open-tender pages
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC = 7:00 ET (EDT) / 6:00 ET (EST)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-tenders
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Build weekly pages from SEAO open data (Données Québec)
        run: python scripts/build_weekly.py --cache "$RUNNER_TEMP/seao"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fr/appels-offres-cette-semaine scripts/weekly_manifest.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Weekly open-tender pages: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
